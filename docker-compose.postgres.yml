version: '3.8'
services:
  db:
    image: myregistry.azurecr.io/postgres-pgvector:15
    container_name: senegal_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mypostgres
      POSTGRES_DB: senegal_survey_agent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://root:mypostgres@db:5432/senegal_survey_agent_db
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  pgdata:
